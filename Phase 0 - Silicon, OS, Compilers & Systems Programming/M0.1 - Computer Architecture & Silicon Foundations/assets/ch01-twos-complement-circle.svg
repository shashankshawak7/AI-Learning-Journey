<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 510' width='920' height='510' font-family='system-ui, -apple-system, sans-serif'>
  <rect width='920' height='510' rx='16' fill='#0f172a'/>
  <text x='36' y='40' fill='#f8fafc' font-size='20' font-weight='700'>Negative Numbers &amp; Overflow = A Car Odometer Wheel</text>
  <text x='36' y='64' fill='#94a3b8' font-size='13'>Imagine a 4-switch dial. Step forward (+1) clockwise. Step backward (-1) counter-clockwise past 0000 → you land on 1111 (-1)!</text>

  <circle cx='250' cy='280' r='122' fill='none' stroke='#1e293b' stroke-width='26'/>
  <circle cx='250' cy='280' r='78' fill='none' stroke='#1e293b' stroke-width='1' stroke-dasharray='4 4'/>
  <text x='250' y='92' text-anchor='middle' fill='#94a3b8' font-size='11'>Outer: Unsigned (0..15) · Boxes: Switches · Inner: Signed (-8..+7)</text>

  <line x1='260.1' y1='331.0' x2='286.3' y2='462.4' stroke='#f43f5e' stroke-width='2.5' stroke-dasharray='5 4'/>
  <rect x='184' y='472' width='230' height='24' rx='6' fill='#881337' stroke='#f43f5e' stroke-width='1.5'/>
  <text x='299' y='488' text-anchor='middle' fill='#ffe4e6' font-size='11' font-weight='700'>Overflow Cliff: +7 + 1 wraps to -8!</text>

  <line x1='239.9' y1='229.0' x2='213.7' y2='97.6' stroke='#f59e0b' stroke-width='2' stroke-dasharray='5 4'/>
  <rect x='14' y='106' width='158' height='24' rx='6' fill='#451a03' stroke='#f59e0b' stroke-width='1.2'/>
  <text x='93' y='122' text-anchor='middle' fill='#fde68a' font-size='10.5' font-weight='700'>Roll back 0 → 1111 (-1)</text>

  <text x='250' y='274' text-anchor='middle' fill='#cbd5e1' font-size='12' font-weight='700'>+1 Clockwise</text>
  <text x='250' y='292' text-anchor='middle' fill='#64748b' font-size='11'>-1 Counter-CW</text>

  <g font-family='ui-monospace, monospace'>
    <text x='250.0' y='118.0' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>0</text>
    <rect x='229.0' y='147.0' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='250.0' y='162.0' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0000</text>
    <text x='250.0' y='206.0' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+0</text>
    <text x='313.5' y='130.6' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>1</text>
    <rect x='275.7' y='156.3' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='296.7' y='171.3' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0001</text>
    <text x='279.8' y='211.9' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+1</text>
    <text x='367.4' y='166.6' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>2</text>
    <rect x='315.3' y='182.7' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='336.3' y='197.7' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0010</text>
    <text x='305.2' y='228.8' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+2</text>
    <text x='403.4' y='220.5' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>3</text>
    <rect x='341.7' y='222.3' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='362.7' y='237.3' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0011</text>
    <text x='322.1' y='254.2' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+3</text>
    <text x='416.0' y='284.0' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>4</text>
    <rect x='351.0' y='269.0' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='372.0' y='284.0' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0100</text>
    <text x='328.0' y='284.0' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+4</text>
    <text x='403.4' y='347.5' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>5</text>
    <rect x='341.7' y='315.7' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='362.7' y='330.7' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0101</text>
    <text x='322.1' y='313.8' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+5</text>
    <text x='367.4' y='401.4' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>6</text>
    <rect x='315.3' y='355.3' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='336.3' y='370.3' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0110</text>
    <text x='305.2' y='339.2' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+6</text>
    <text x='313.5' y='437.4' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>7</text>
    <rect x='275.7' y='381.7' width='42' height='22' rx='6' fill='#064e3b' stroke='#34d399' stroke-width='1.5'/>
    <text x='296.7' y='396.7' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>0111</text>
    <text x='279.8' y='356.1' text-anchor='middle' fill='#6ee7b7' font-size='11.5' font-weight='700'>+7</text>
    <text x='250.0' y='450.0' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>8</text>
    <rect x='229.0' y='391.0' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='250.0' y='406.0' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1000</text>
    <text x='250.0' y='362.0' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-8</text>
    <text x='186.5' y='437.4' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>9</text>
    <rect x='182.3' y='381.7' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='203.3' y='396.7' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1001</text>
    <text x='220.2' y='356.1' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-7</text>
    <text x='132.6' y='401.4' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>10</text>
    <rect x='142.7' y='355.3' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='163.7' y='370.3' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1010</text>
    <text x='194.8' y='339.2' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-6</text>
    <text x='96.6' y='347.5' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>11</text>
    <rect x='116.3' y='315.7' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='137.3' y='330.7' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1011</text>
    <text x='177.9' y='313.8' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-5</text>
    <text x='84.0' y='284.0' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>12</text>
    <rect x='107.0' y='269.0' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='128.0' y='284.0' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1100</text>
    <text x='172.0' y='284.0' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-4</text>
    <text x='96.6' y='220.5' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>13</text>
    <rect x='116.3' y='222.3' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='137.3' y='237.3' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1101</text>
    <text x='177.9' y='254.2' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-3</text>
    <text x='132.6' y='166.6' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>14</text>
    <rect x='142.7' y='182.7' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='163.7' y='197.7' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1110</text>
    <text x='194.8' y='228.8' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-2</text>
    <text x='186.5' y='130.6' text-anchor='middle' fill='#94a3b8' font-size='12' font-weight='700'>15</text>
    <rect x='182.3' y='156.3' width='42' height='22' rx='6' fill='#4c0519' stroke='#fb7185' stroke-width='1.5'/>
    <text x='203.3' y='171.3' text-anchor='middle' fill='#f8fafc' font-size='11' font-weight='700'>1111</text>
    <text x='220.2' y='211.9' text-anchor='middle' fill='#fda4af' font-size='11.5' font-weight='700'>-1</text></g>

  <rect x='492' y='100' width='396' height='172' rx='12' fill='#1e293b' stroke='#334155' stroke-width='1.5'/>
  <text x='512' y='128' fill='#38bdf8' font-size='15' font-weight='700'>Why Does 1111 Mean -1 (and 15)?</text>
  <text x='512' y='154' fill='#cbd5e1' font-size='12.5'>In unsigned mode, the left switch adds <tspan fill='#34d399' font-weight='700'>+8</tspan>.</text>
  <text x='512' y='176' fill='#cbd5e1' font-size='12.5'>In signed mode, that same left switch is a <tspan fill='#fb7185' font-weight='700'>-8 debt</tspan>:</text>
  <text x='512' y='208' fill='#fda4af' font-size='13.5' font-weight='700' font-family='ui-monospace, monospace'>1111 = -8 + 4 + 2 + 1 = -1</text>
  <text x='512' y='234' fill='#fda4af' font-size='13.5' font-weight='700' font-family='ui-monospace, monospace'>1000 = -8 + 0 + 0 + 0 = -8</text>
  <text x='512' y='258' fill='#94a3b8' font-size='11.5'>Result: Zero has only ONE pattern (0000), and addition works cleanly!</text>

  <rect x='492' y='288' width='396' height='190' rx='12' fill='#1e293b' stroke='#334155' stroke-width='1.5'/>
  <text x='512' y='316' fill='#a78bfa' font-size='15' font-weight='700'>2-Step Recipe to Make Any Negative Number</text>
  <text x='512' y='342' fill='#94a3b8' font-size='12.5'>Example: How do you write -5 in 4 bits?</text>
  <text x='512' y='370' fill='#e2e8f0' font-size='13' font-family='ui-monospace, monospace'>Step 0 · Start with +5 :  0 1 0 1</text>
  <text x='512' y='396' fill='#fbbf24' font-size='13' font-family='ui-monospace, monospace'>Step 1 · Flip every bit :  1 0 1 0  (0↔1)</text>
  <text x='512' y='422' fill='#34d399' font-size='13' font-family='ui-monospace, monospace'>Step 2 · Add +1         :  1 0 1 1  (-8+2+1 = -5)</text>
  <text x='512' y='454' fill='#cbd5e1' font-size='12'>Check it: 0101 (+5) + 1011 (-5) = <tspan fill='#34d399' font-weight='700'>10000</tspan> → top 1 drops off → 0000!</text>
</svg>