<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="470" rx="16" fill="#0f172a"/>
  <text x="36" y="40" fill="#f8fafc" font-size="20" font-weight="700">How Letters &amp; Emojis Become Bytes (ASCII → Unicode → UTF-8)</text>
  <text x="36" y="64" fill="#94a3b8" font-size="13">Step 1: Look up the character's Dictionary ID (Unicode).  Step 2: Pack that ID into 1 to 4 byte envelopes (UTF-8).</text>

  <!-- Legend -->
  <rect x="36" y="84" width="14" height="14" rx="3" fill="#b45309" stroke="#f59e0b"/>
  <text x="58" y="96" fill="#fcd34d" font-size="12">Envelope Header (tells CPU how many bytes belong together)</text>
  <rect x="440" y="84" width="14" height="14" rx="3" fill="#6b21a8" stroke="#c084fc"/>
  <text x="462" y="96" fill="#d8b4fe" font-size="12">Helper Tag "10" (not a new letter!)</text>
  <rect x="695" y="84" width="14" height="14" rx="3" fill="#0369a1" stroke="#38bdf8"/>
  <text x="717" y="96" fill="#7dd3fc" font-size="12">Character ID Bits</text>

  <!-- Row 1: A -->
  <rect x="36" y="116" width="848" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="146" fill="#f8fafc" font-size="16" font-weight="700">'A'  (ID #65)</text>
  <text x="54" y="170" fill="#34d399" font-size="12">1 envelope · Same as 1960s ASCII!</text>
  <rect x="292" y="132" width="136" height="40" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#fbbf24">0</tspan><tspan fill="#7dd3fc">1000001</tspan></text>
  <text x="456" y="157" fill="#94a3b8" font-size="12">Starts with <tspan fill="#fbbf24" font-weight="700">0</tspan> → "Solo 1-byte English letter"</text>

  <!-- Row 2: π -->
  <rect x="36" y="200" width="848" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="230" fill="#f8fafc" font-size="16" font-weight="700">'π'  (ID #960)</text>
  <text x="54" y="254" fill="#94a3b8" font-size="12">2 envelopes · Greek / accented letters</text>
  <rect x="292" y="216" width="136" height="40" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="241" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#fbbf24">110</tspan><tspan fill="#7dd3fc">01111</tspan></text>
  <rect x="438" y="216" width="136" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="506" y="241" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#d8b4fe">10</tspan><tspan fill="#7dd3fc">000000</tspan></text>
  <text x="594" y="241" fill="#94a3b8" font-size="12">Starts with <tspan fill="#fbbf24" font-weight="700">110</tspan> → "Read 2 bytes"</text>

  <!-- Row 3: अ -->
  <rect x="36" y="284" width="848" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="314" fill="#f8fafc" font-size="16" font-weight="700">'अ'  (ID #2309)</text>
  <text x="54" y="338" fill="#94a3b8" font-size="12">3 envelopes · Hindi / Chinese / symbols</text>
  <rect x="292" y="300" width="136" height="40" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="325" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#fbbf24">1110</tspan><tspan fill="#7dd3fc">0000</tspan></text>
  <rect x="438" y="300" width="136" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="506" y="325" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#d8b4fe">10</tspan><tspan fill="#7dd3fc">100100</tspan></text>
  <rect x="584" y="300" width="136" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="652" y="325" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#d8b4fe">10</tspan><tspan fill="#7dd3fc">000101</tspan></text>
  <text x="738" y="325" fill="#94a3b8" font-size="12"><tspan fill="#fbbf24" font-weight="700">1110</tspan> = "Read 3 bytes"</text>

  <!-- Row 4: 🧠 -->
  <rect x="36" y="368" width="848" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="398" fill="#f8fafc" font-size="16" font-weight="700">'🧠' (ID #129504)</text>
  <text x="54" y="422" fill="#94a3b8" font-size="12">4 envelopes · Emojis &amp; rare scripts</text>
  <rect x="292" y="384" width="136" height="40" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="409" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#fbbf24">11110</tspan><tspan fill="#7dd3fc">000</tspan></text>
  <rect x="438" y="384" width="136" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="506" y="409" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#d8b4fe">10</tspan><tspan fill="#7dd3fc">011111</tspan></text>
  <rect x="584" y="384" width="136" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="652" y="409" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#d8b4fe">10</tspan><tspan fill="#7dd3fc">100111</tspan></text>
  <rect x="730" y="384" width="136" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="798" y="409" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, monospace"><tspan fill="#d8b4fe">10</tspan><tspan fill="#7dd3fc">100000</tspan></text>
</svg>
